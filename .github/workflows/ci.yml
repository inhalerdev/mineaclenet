name: CI

# Builds every push and pull request exactly like the server does, so a
# commit that cannot build shows a red X on GitHub instead of reaching the
# home server.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app/web
    env:
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.nvmrc

      - name: Install pnpm (version pinned in package.json)
        run: |
          PNPM_VERSION="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${PNPM_VERSION}"
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # next build also runs the TypeScript check and generates next-env.d.ts
      - name: Build
        run: pnpm run build

      - name: Typecheck
        run: pnpm run typecheck
